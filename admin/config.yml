backend:
  name: github
  repo: mondinellisg-prog/loreley
  branch: main

media_folder: "assets/productos"
public_folder: "assets/productos"

display_url: "https://loreley.pages.dev"

collections:
  - name: "productos"
    label: "Catálogo de Productos"
    label_singular: "Producto"
    file: "content/catalogo.json"
    identifier_field: nombre
    bulk_edit: true
    table_columns:
      - { field: nombre, label: Producto }
      - { field: precio, label: Precio }
      - { field: stock, label: Stock }
      - { field: id, label: Código }
    sortable_fields:
      fields: [nombre, precio, stock, categoria]
      default:
        field: nombre
        direction: ascending
    view_groups:
      groups:
        - name: categoria
          label: Categoría
          field: categoria
        - name: stock
          label: Estado de Stock
          field: stock
      default: categoria
    view_filters:
      - label: Disponibles (Con Stock)
        field: stock
        pattern: "^con stock$"
      - label: Agotados (Sin Stock)
        field: stock
        pattern: "^sin stock$"
    fields:
      - { label: "Código / ID", name: "id", widget: "string" }
      - { label: "Nombre del Producto", name: "nombre", widget: "string" }
      - label: "Categoría"
        name: "categoria"
        widget: "relation"
        collection: "categorias"
        value_field: "id"
        display_fields: ["nombre"]
        search_fields: ["nombre", "id"]
      - { label: "Contenido / Medida (ml/g)", name: "medida", widget: "string", required: false }
      - { label: "Precio ($ ARS)", name: "precio", widget: "number", value_type: "int" }
      - label: "Estado del Stock"
        name: "stock"
        widget: "select"
        default: "con stock"
        options:
          - { label: "Disponible (Con Stock)", value: "con stock" }
          - { label: "Agotado (Sin Stock)", value: "sin stock" }
      - { label: "Descripción o Modo de Uso", name: "descripcion", widget: "text", required: false }
      - { label: "Fotografía", name: "imagen", widget: "image", required: false }

  - name: "categorias"
    label: "Categorías"
    label_singular: "Categoría"
    file: "content/categorias.json"
    identifier_field: nombre
    fields:
      - { label: "Nombre visible", name: "nombre", widget: "string", hint: "Cómo se verá en la tienda (ej: Ofertas de Verano)" }
      - { label: "Identificador interno", name: "id", widget: "string", hint: "Escribilo en minúsculas y sin tildes (ej: ofertas de verano)" }
