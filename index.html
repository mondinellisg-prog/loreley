<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loreley Cosméticos | Tienda Oficial</title>
  <meta name="description" content="Cosmética profesional, cuidado facial, corporal y maquillaje. Asesoramiento personalizado.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fdf8f6',
              100: '#f2e8e5',
              500: '#b46d65',
              600: '#9b5850',
              900: '#3c2421',
            }
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#faf9f8] text-stone-800 antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-stone-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      
      <!-- Marca -->
      <a href="#" class="flex flex-col">
        <span class="font-serif tracking-widest text-2xl uppercase text-brand-900 font-semibold">Loreley</span>
        <span class="text-[10px] tracking-widest text-stone-500 uppercase -mt-1">Cosméticos</span>
      </a>

      <!-- Buscador -->
      <div class="flex-1 max-w-md hidden md:block">
        <div class="relative">
          <input 
            type="search" 
            id="searchInput" 
            placeholder="Buscar por producto, activo o código..." 
            class="w-full bg-stone-100 border-none rounded-full px-4 py-2 pl-10 text-sm focus:ring-2 focus:ring-brand-500 outline-none transition"
          >
          <svg class="w-4 h-4 text-stone-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>

      <!-- Carrito Trigger -->
      <button id="openCartBtn" class="relative p-2.5 rounded-full hover:bg-stone-100 transition" aria-label="Abrir carrito">
        <svg class="w-6 h-6 text-stone-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        <span id="cartCount" class="absolute top-1 right-1 bg-brand-500 text-white font-bold text-xs rounded-full w-5 h-5 flex items-center justify-center opacity-0 scale-75 transition-all">0</span>
      </button>
    </div>

    <!-- Buscador Mobile -->
    <div class="px-4 pb-3 md:hidden">
      <input 
        type="search" 
        id="searchInputMobile" 
        placeholder="Buscar productos..." 
        class="w-full bg-stone-100 border-none rounded-full px-4 py-2 text-sm focus:ring-2 focus:ring-brand-500 outline-none"
      >
    </div>

    <!-- Filtros de Categorías (Barra horizontal desplazable) -->
    <nav class="border-t border-stone-100 bg-white">
      <div class="max-w-7xl mx-auto px-4 flex gap-2 overflow-x-auto py-2.5 no-scrollbar" id="categoryTabs">
        <!-- Render dinámico de las 24 categorías -->
      </div>
    </nav>
  </header>

  <!-- Catálogo Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1">
    <div id="loadingState" class="flex flex-col items-center justify-center py-24 text-stone-400">
      <div class="w-8 h-8 border-2 border-brand-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-sm">Cargando catálogo oficial...</p>
    </div>

    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
      <!-- Cards renderizadas con JS -->
    </div>

    <div id="emptyState" class="hidden text-center py-24">
      <p class="text-stone-500 font-serif text-lg">No se encontraron productos que coincidan con la búsqueda.</p>
    </div>
  </main>

  <!-- Carrito Lateral (Drawer) -->
  <div id="cartDrawerBackdrop" class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300"></div>
  <aside id="cartDrawer" class="fixed inset-y-0 right-0 max-w-md w-full bg-white z-50 shadow-2xl flex flex-col translate-x-full transition-transform duration-300 ease-in-out">
    <div class="p-4 border-b border-stone-200 flex items-center justify-between">
      <h2 class="font-serif text-lg tracking-wide uppercase text-stone-800">Tu Pedido</h2>
      <button id="closeCartBtn" class="p-2 text-stone-400 hover:text-stone-700" aria-label="Cerrar">✕</button>
    </div>

    <!-- Lista de Items en Carrito -->
    <div id="cartItemsList" class="flex-1 overflow-y-auto p-4 divide-y divide-stone-100">
      <!-- Se inyecta con JS -->
    </div>

    <!-- Footer Carrito y Checkout -->
    <div class="p-4 border-t border-stone-200 bg-stone-50 space-y-3">
      <div class="flex justify-between items-center text-base font-semibold text-stone-900">
        <span>Total Estimado:</span>
        <span id="cartSubtotal" class="font-sans text-brand-600 text-xl">$0</span>
      </div>
      <button id="checkoutWhatsappBtn" class="w-full bg-[#25D366] hover:bg-[#20ba5a] text-white py-3.5 px-4 rounded-xl font-medium tracking-wide flex items-center justify-center gap-2 shadow-lg transition active:scale-95">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
        Completar Pedido por WhatsApp
      </button>
      <p class="text-center text-[11px] text-stone-400">Coordinaremos stock exacto, pago y envío directo con vos.</p>
    </div>
  </aside>

  <!-- Lógica de Negocio Vanilla JS -->
  <script>
    const WHATSAPP_NUMBER = "5491136293941";
    
    // Categorías oficiales
    const CATEGORIAS = [
      { id: "todas", nombre: "Todas" },
      { id: "cuidados basicos", nombre: "Cuidados Básicos" },
      { id: "dermatocosmetica dr. enero", nombre: "Dr. Enero" },
      { id: "pieles delicadas", nombre: "Pieles Delicadas" },
      { id: "antiage", nombre: "Antiage" },
      { id: "hidratacion humectacion tonificacion", nombre: "Hidratación & Bruma" },
      { id: "pieles grasas", nombre: "Pieles Grasas" },
      { id: "manos y pies", nombre: "Manos & Pies" },
      { id: "cuidados masculinos", nombre: "Masculinos" },
      { id: "cuidados capilares", nombre: "Capilares" },
      { id: "laca beauty", nombre: "Laca Beauty" },
      { id: "corporales", nombre: "Corporales" },
      { id: "renovacion celular", nombre: "Renovación Celular" },
      { id: "teens", nombre: "Teens" },
      { id: "fragancias", nombre: "Fragancias" },
      { id: "sensorial", nombre: "Sensorial" },
      { id: "proteccion solar", nombre: "Protección Solar" },
      { id: "preparacion piel", nombre: "Preparación Piel" },
      { id: "correctores iluminadores rubores", nombre: "Correctores & Rubor" },
      { id: "delineadores", nombre: "Delineadores" },
      { id: "pestanas y cejas", nombre: "Pestañas & Cejas" },
      { id: "sombras", nombre: "Sombras" },
      { id: "labios", nombre: "Labios" },
      { id: "unas", nombre: "Uñas" },
      { id: "aceites esenciales", nombre: "Aceites Esenciales" }
    ];

    // Estado en memoria
    let productos = [];
    let activeCategory = "todas";
    let searchQuery = "";
    let cart = JSON.parse(localStorage.getItem('loreley_cart') || '{}');

    // Formateador de moneda argentina
    const formatCurrency = (val) => new Intl.NumberFormat('es-AR', {
      style: 'currency',
      currency: 'ARS',
      maximumFractionDigits: 0
    }).format(val);

    // Sanitizador Anti-XSS
    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Inicialización
    async function init() {
      renderCategoryTabs();
      initEvents();
      updateCartUI();

      try {
        const res = await fetch('./content/catalogo.json');
        if (!res.ok) throw new Error("No se pudo cargar el archivo catalogo.json");
        const data = await res.json();
        productos = data.productos || [];
      } catch (err) {
        console.error("Error al cargar productos:", err);
      } finally {
        document.getElementById('loadingState').classList.add('hidden');
        renderProducts();
      }
    }

    // Render de tabs de categoría
    function renderCategoryTabs() {
      const container = document.getElementById('categoryTabs');
      container.innerHTML = CATEGORIAS.map(cat => `
        <button 
          data-category="${cat.id}"
          class="cat-tab whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs font-medium transition cursor-pointer ${
            activeCategory === cat.id 
              ? 'bg-brand-500 text-white shadow-sm' 
              : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
          }"
        >
          ${escapeHTML(cat.nombre)}
        </button>
      `).join('');

      container.querySelectorAll('.cat-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.getAttribute('data-category');
          renderCategoryTabs();
          renderProducts();
        });
      });
    }

    // Filtrar y renderizar productos
    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const empty = document.getElementById('emptyState');

      const filtered = productos.filter(p => {
        const matchesCat = activeCategory === "todas" || p.categoria.toLowerCase() === activeCategory.toLowerCase();
        const q = searchQuery.toLowerCase().trim();
        const matchesSearch = !q || 
          p.nombre.toLowerCase().includes(q) || 
          p.id.toLowerCase().includes(q) ||
          p.categoria.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      grid.innerHTML = filtered.map(prod => {
        const inStock = prod.stock === "con stock";
        const imgUrl = prod.imagen || `${prod.id}.jpg`;

        return `
          <article class="bg-white rounded-2xl border border-stone-200/70 p-3 flex flex-col justify-between hover:shadow-md transition">
            <div>
              <div class="relative w-full aspect-square bg-stone-100 rounded-xl overflow-hidden mb-3">
                <img 
                  src="${escapeHTML(imgUrl)}" 
                  alt="${escapeHTML(prod.nombre)}" 
                  loading="lazy"
                  class="w-full h-full object-cover transition-transform duration-300 hover:scale-105"
                  onerror="this.onerror=null; this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22 viewBox=%220 0 100 100%22><rect fill=%22%23eee%22 width=%22100%22 height=%22100%22/><text fill=%22%23999%22 x=%2250%%22 y=%2250%%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-size=%2210%22>Sin Foto</text></svg>'"
                />
                ${!inStock ? `
                  <span class="absolute top-2 right-2 bg-stone-900/80 backdrop-blur-sm text-white text-[10px] tracking-wider uppercase px-2 py-0.5 rounded-full font-bold">
                    Agotado
                  </span>
                ` : ''}
              </div>
              <p class="text-[10px] uppercase font-bold tracking-widest text-brand-500 mb-1">
                ${escapeHTML(prod.medida || prod.categoria)}
              </p>
              <h3 class="text-sm font-medium text-stone-800 leading-snug line-clamp-2" title="${escapeHTML(prod.nombre)}">
                ${escapeHTML(prod.nombre)}
              </h3>
            </div>

            <div class="mt-3 pt-2 border-t border-stone-100 flex items-center justify-between gap-2">
              <span class="text-base font-semibold text-stone-900">${formatCurrency(prod.precio)}</span>
              
              <button 
                onclick="addToCart('${escapeHTML(prod.id)}')"
                ${!inStock ? 'disabled' : ''}
                class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                  inStock 
                    ? 'bg-stone-900 hover:bg-brand-500 text-white active:scale-95' 
                    : 'bg-stone-100 text-stone-400 cursor-not-allowed'
                }"
              >
                ${inStock ? 'Agregar' : 'Sin Stock'}
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    // Manejo del Carrito
    window.addToCart = function(id) {
      const prod = productos.find(p => p.id === id);
      if (!prod || prod.stock !== "con stock") return;

      if (cart[id]) {
        cart[id].qty += 1;
      } else {
        cart[id] = {
          id: prod.id,
          nombre: prod.nombre,
          precio: prod.precio,
          qty: 1
        };
      }
      persistCart();
      updateCartUI();
      openCart();
    };

    function updateCartQuantity(id, delta) {
      if (!cart[id]) return;
      cart[id].qty += delta;
      if (cart[id].qty <= 0) {
        delete cart[id];
      }
      persistCart();
      updateCartUI();
    }

    function persistCart() {
      localStorage.setItem('loreley_cart', JSON.stringify(cart));
    }

    function updateCartUI() {
      const cartItemsList = document.getElementById('cartItemsList');
      const cartCount = document.getElementById('cartCount');
      const cartSubtotal = document.getElementById('cartSubtotal');

      const items = Object.values(cart);
      const totalUnits = items.reduce((acc, it) => acc + it.qty, 0);
      const totalPrice = items.reduce((acc, it) => acc + (it.precio * it.qty), 0);

      // Contador visual
      if (totalUnits > 0) {
        cartCount.textContent = totalUnits;
        cartCount.classList.remove('opacity-0', 'scale-75');
      } else {
        cartCount.classList.add('opacity-0', 'scale-75');
      }

      cartSubtotal.textContent = formatCurrency(totalPrice);

      if (items.length === 0) {
        cartItemsList.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-center py-16 text-stone-400">
            <svg class="w-12 h-12 mb-3 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
            <p class="text-sm">Tu carrito está vacío.</p>
          </div>
        `;
        return;
      }

      cartItemsList.innerHTML = items.map(it => `
        <div class="py-3 flex justify-between items-center gap-3">
          <div class="flex-1">
            <h4 class="text-xs font-semibold text-stone-800 line-clamp-1">${escapeHTML(it.nombre)}</h4>
            <span class="text-xs text-stone-500">${formatCurrency(it.precio)} c/u</span>
          </div>

          <div class="flex items-center gap-2">
            <div class="flex items-center border border-stone-200 rounded-lg">
              <button onclick="updateCartQuantity('${it.id}', -1)" class="px-2 py-0.5 text-stone-500 hover:text-stone-800 text-xs">−</button>
              <span class="px-2 py-0.5 text-xs font-semibold text-stone-800">${it.qty}</span>
              <button onclick="updateCartQuantity('${it.id}', 1)" class="px-2 py-0.5 text-stone-500 hover:text-stone-800 text-xs">+</button>
            </div>
            <span class="text-xs font-bold text-stone-900 w-16 text-right">${formatCurrency(it.precio * it.qty)}</span>
          </div>
        </div>
      `).join('');
    }

    // Checkout WhatsApp
    function setupCheckout() {
      const items = Object.values(cart);
      if (items.length === 0) {
        alert("Tu carrito está vacío. Agrega algún producto para iniciar el pedido.");
        return;
      }

      const total = items.reduce((acc, it) => acc + (it.precio * it.qty), 0);
      
      let mensaje = `¡Hola Loreley Cosméticos! Quisiera realizar el siguiente pedido:\n\n`;
      items.forEach(it => {
        mensaje += `• ${it.nombre} (x${it.qty}) - ${formatCurrency(it.precio * it.qty)}\n`;
      });
      mensaje += `\n*Total Estimado: ${formatCurrency(total)}*\n\n`;
      mensaje += `¿Me confirmas disponibilidad para coordinar la entrega? Muchas gracias.`;

      const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    }

    // Listeners y Drawer
    function openCart() {
      document.getElementById('cartDrawerBackdrop').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('cartDrawer').classList.remove('translate-x-full');
    }

    function closeCart() {
      document.getElementById('cartDrawerBackdrop').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('cartDrawer').classList.add('translate-x-full');
    }

    function initEvents() {
      document.getElementById('openCartBtn').addEventListener('click', openCart);
      document.getElementById('closeCartBtn').addEventListener('click', closeCart);
      document.getElementById('cartDrawerBackdrop').addEventListener('click', closeCart);
      document.getElementById('checkoutWhatsappBtn').addEventListener('click', setupCheckout);

      const handleSearch = (e) => {
        searchQuery = e.target.value;
        renderProducts();
      };

      document.getElementById('searchInput').addEventListener('input', handleSearch);
      document.getElementById('searchInputMobile').addEventListener('input', handleSearch);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
