    function normalizarPrecio(p) {
      if (!p) return 0;
      return parseInt(p.toString().replace(/[^0-9]/g, ''), 10) || 0;
    }

    document.getElementById('btn').addEventListener('click', () => {
      const lines = csvRaw.trim().split(/\r?\n/).slice(1);
      const productos = [];

      for (const line of lines) {
        if (!line.trim()) continue;
        const cols = line.split(',');
        const id = (cols[0] || '').trim();
        const nombre = (cols[1] || '').trim();
        const medida = (cols[2] || '').trim();
        const descripcion = (cols[3] || '').trim();
        const precio = normalizarPrecio(cols[4]);
        const categoria = (cols[5] || '').trim().toLowerCase();
        const stock = (cols[6] || '').trim().toLowerCase() === 'sin stock' ? 'sin stock' : 'con stock';
        const img = (cols[7] || `${id}.jpg`).trim();

        if (id && nombre) {
          productos.push({
            id,
            nombre,
            medida: medida ? `${medida} ml/g` : '',
            descripcion,
            precio,
            categoria,
            stock,
            imagen: `assets/productos/${img}`
          });
        }
      }

      // Descarga automática del archivo catalogo.json
      const blob = new Blob([JSON.stringify({ productos }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'catalogo.json';
      a.click();
    });
  </script>
